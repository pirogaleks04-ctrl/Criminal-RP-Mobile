
name: Build Criminal RP Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Criminal_RP_Mobile_Android_Build_Kit.zip'

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - - name: Extract project
  run: |
    mkdir -p extracted
    ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
    if [ -z "$ZIP_FILE" ]; then
      echo "ZIP archive not found"
      ls -la
      exit 1
    fi
    echo "Found archive: $ZIP_FILE"
    unzip -q "$ZIP_FILE" -d extracted
    cd extracted/Criminal_RP_Mobile_01
    mkdir -p build

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CriminalRP-Android-debug
          path: extracted/Criminal_RP_Mobile_01/build/CriminalRP-debug.apk
