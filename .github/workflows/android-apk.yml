
name: Build Criminal RP Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir -p extracted
          ZIP_FILE=$(find . -type f -iname '*.zip' -not -path './extracted/*' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP archive not found in repository"
            find . -maxdepth 3 -type f
            exit 1
          fi
          echo "Found archive: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d extracted
          PROJECT_DIR=$(find extracted -name project.godot -printf '%h\n' | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Godot project not found"
            exit 1
          fi
          echo "Project: $PROJECT_DIR"
          mkdir -p "$PROJECT_DIR/build"
          echo "$PROJECT_DIR" > project_dir.txt

      - name: Build Android APK
       
      - name: Configure Android SDK
        run: |
          GODOT_VERSION=$(godot --version | sed -E 's/^([0-9]+\.[0-9]+).*/\1/')
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-${GODOT_VERSION}.tres <<'EOF'
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/debug_keystore = "/root/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          echo "Godot version: $GODOT_VERSION"
          java -version
          ls /usr/lib/android-sdk/build-tools/        
       run: |
          PROJECT_DIR=$(cat project_dir.txt)
          godot --headless --path "$PROJECT_DIR" --export-debug "Android" "$PROJECT_DIR/build/CriminalRP-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CriminalRP-Android-debug
          path: extracted/**/build/CriminalRP-debug.apk
